[project]
name = "chess-coach"
version = "0.1.0"
description = "Personal data-driven chess coaching pipeline on top of the Lichess API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chess>=1.11",
    "httpx>=0.27",
    "markdown>=3.6",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
