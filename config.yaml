# chess-coach user settings. See DESIGN.md §5.
lichess:
  username: netangel
  review_study_id: ubCwtsu5       # private review study, created by `study --init` (2026-11-27)
training:
  main_perf: rapid            # rapid 15+10 (decided 2026-11-26)
  tracked_perfs: [rapid, classical, blitz, correspondence]
  budget:
    daily_minutes: 20
    games_per_week: 3
    weekend_block_minutes: 30
  focus_duration_weeks: 2     # min weeks before a focus area is re-evaluated
engine:
  binary: stockfish
  version: auto               # auto = read from the binary's UCI id; part of the analysis cache key
  nodes_per_position: 1000000
  threads: 2
  hash_mb: 256
analysis:
  # blitz/bullet: synced, but analysed only on demand.
  # correspondence: legacy casual games (2016–2025) used as a low-confidence baseline only;
  # metrics stay per perf, so they never mix with classical/rapid numbers.
  only_perfs: [classical, rapid, correspondence]
  min_plies: 20                    # skip abandoned/aborted games
  since: null                      # null = whole history (baseline decision 2026-11-26)
  time_pressure_fraction: 0.10     # remaining clock < 10% of initial time
  thresholds: [5, 10, 15]          # win% drop: inaccuracy / mistake / blunder (= Lichess)
review:
  boxes_days: [1, 3, 7, 14, 30]    # Leitner intervals
  max_due_per_day: 5
  max_chapters: 60                 # below Lichess 64 limit
coach:
  language: ru                     # plans and journal are written in Russian
dashboard:
  public: true
