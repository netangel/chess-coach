<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шахматный тренер</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="preload" href="fonts/IBMPlexSans-Regular-Cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts/plex.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>♞ Тренер</h1>
      <p class="sub" id="subtitle">загрузка…</p>
    </div>
  </header>

  <main class="wrap">
    <section id="today" class="card">
      <h2>Сегодня</h2>
      <div id="today-body"></div>
    </section>

    <section id="week" class="card">
      <h2>Эта неделя</h2>
      <div id="week-body"></div>
    </section>

    <section id="trends" class="card">
      <h2>Динамика</h2>
      <div id="trends-body" class="charts"></div>
    </section>

    <section id="diagnosis" class="card">
      <h2>Диагноз</h2>
      <div id="diagnosis-body"></div>
    </section>

    <section id="journal" class="card">
      <h2>Журнал</h2>
      <div id="journal-body" class="prose"></div>
    </section>
  </main>

  <footer class="wrap foot" id="footer"></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
