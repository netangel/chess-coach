name: weekly

on:
  schedule:
    - cron: "7 16 * * 0"   # Sunday ~16:00 UTC, before the weekly review
  workflow_dispatch:
    inputs:
      push:
        description: "Push the data commit (false = dry run)"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Full pipeline, snapshot, diagnosis
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: |
          uv run python -m pipeline -v all
          uv run python -m pipeline snapshot
          uv run python -m pipeline metrics
          uv run python -m pipeline diagnose

      - name: Commit data
        run: >
          .github/scripts/commit-data.sh
          "data: weekly $(date -u +%G-W%V)"
          "${{ github.event_name == 'schedule' || inputs.push }}"

      - name: Open the weekly check-in issue
        if: github.event_name == 'schedule' || inputs.push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv run python -m pipeline checkin render > "$RUNNER_TEMP/checkin.md"
          week=$(grep -o 'week=[0-9]*-W[0-9]*' "$RUNNER_TEMP/checkin.md" | cut -d= -f2)
          gh label create checkin --color 0E8A16 --description "Weekly review check-in" --force
          if gh issue list --label checkin --state all --search "$week in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "check-in for $week already exists"
          else
            gh issue create --label checkin --title "Проверка разбора $week" --body-file "$RUNNER_TEMP/checkin.md"
          fi

  pages:
    needs: weekly
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name == 'schedule' || inputs.push
    uses: ./.github/workflows/pages.yml
